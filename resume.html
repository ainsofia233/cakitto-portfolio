<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Resume | Cakittos Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* ===== RESET ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Poppins', sans-serif;
    background-color: #F5EBDD;
    color: #3B2118;
}

/* ===== HEADER ===== */
header {
    min-height: 220px;
    background:
        linear-gradient(rgba(40, 21, 15, 0.68),
                        rgba(40, 21, 15, 0.68)),
        url('background/Bannerhomep.png');

    background-size: cover;
    background-position: center;
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 35px 20px;
}

/* ===== SMALL LOGO ===== */
.logo {
    position: absolute;
    top: 20px;
    left: 30px;
}

.logo img {
    width: 65px;
    height: 65px;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid #C69B70;
}

/* ===== HEADER TITLE ===== */
.header-content h1 {
    font-family: 'Playfair Display', serif;
    font-size: 42px;
    color: #FFF8EF;
    letter-spacing: 1px;
}

.header-content p {
    font-size: 12px;
    color: #E6D0B8;
    letter-spacing: 2px;
    margin-top: 8px;
    text-transform: uppercase;
}

/* ===== NAVIGATION ===== */
nav {
    background-color: #3B2118;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 35px;
    padding: 16px 20px;
}

nav a {
    color: #FFF8EF;
    text-decoration: none;
    font-size: 12px;
    transition: 0.3s ease;
}

nav a:hover,
nav a.active {
    color: #C69B70;
}

/* ===== RESUME SECTION ===== */
.resume-section {
    max-width: 1000px;
    margin: auto;
    padding: 65px 25px 80px;
    text-align: center;
}

.section-label {
    color: #946344;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 12px;
}

.resume-section h2 {
    font-family: 'Playfair Display', serif;
    font-size: 38px;
    font-weight: 500;
    margin-bottom: 15px;
}

.description {
    font-size: 13px;
    color: #68432F;
    margin-bottom: 35px;
}

/* ===== RESUME IMAGE ===== */
.resume-image {
    max-width: 750px;
    margin: 0 auto;
}

.resume-image img {
    display: block;
    width: 100%;
    height: auto;
    border: 8px solid #FFF8EF;
    box-shadow: 0 8px 25px rgba(59, 33, 24, 0.12);
}

/* ===== FOOTER ===== */
footer {
    background-color: #28150F;
    color: #E6D0B8;
    text-align: center;
    padding: 25px 15px;
    font-size: 11px;
    line-height: 2;
}

footer span {
    color: #C69B70;
}

/* ===== TABLET ===== */
@media (max-width: 768px) {
    header {
        min-height: 190px;
    }

    .logo {
        top: 15px;
        left: 15px;
    }

    .logo img {
        width: 50px;
        height: 50px;
    }

    .header-content h1 {
        font-size: 32px;
    }

    nav {
        gap: 18px;
        padding: 15px 12px;
    }

    nav a {
        font-size: 11px;
    }

    .resume-section {
        padding: 45px 20px 60px;
    }

    .resume-section h2 {
        font-size: 32px;
    }

    .description {
        font-size: 12px;
        line-height: 1.8;
    }

    .resume-image img {
        border-width: 5px;
    }
}

/* ===== MOBILE ===== */
@media (max-width: 480px) {
    header {
        min-height: 165px;
        padding: 30px 15px;
    }

    .logo img {
        width: 42px;
        height: 42px;
    }

    .header-content h1 {
        font-size: 27px;
    }

    .header-content p {
        font-size: 9px;
        letter-spacing: 1.5px;
    }

    nav {
        gap: 12px 18px;
        padding: 15px 10px;
    }

    nav a {
        font-size: 10px;
    }

    .resume-section {
        padding: 40px 15px 50px;
    }

    .resume-section h2 {
        font-size: 29px;
    }

    .section-label {
        font-size: 10px;
    }

    .description {
        margin-bottom: 25px;
    }
}
</style>
</head>

<body>

<!-- ===== HEADER ===== -->
<header>

    <a href="index.html" class="logo">
        <img src="gallery/logo.jpg" alt="Cakittos Logo">
    </a>

    <div class="header-content">
        <h1>Cakittos Portfolio</h1>
        <p>A Little Space of Creativity</p>
    </div>

</header>

<!-- ===== NAVIGATION ===== -->
<nav>
    <a href="index.html">Home</a>
    <a href="identity.html">Artist Identity</a>
    <a href="resume.html" class="active">Resume</a>
    <a href="gallery.html">Artwork Gallery</a>
    <a href="contact.html">Contact</a>
</nav>

<!-- ===== RESUME ===== -->
<main>
    <section class="resume-section">

        <p class="section-label">A Little About My Journey</p>

        <h2>My Resume.</h2>

        <p class="description">
            A glimpse into my background, skills and experience.
        </p>

        <div class="resume-image">
            <img src="gallery/resume.jpg" alt="My Resume">
        </div>

    </section>
</main>

<!-- ===== FOOTER ===== -->
<footer>
    <p>© 2026 Cakittos Portfolio. All rights reserved.</p>
    <p>Made with <span>♡</span> and a little creativity.</p>
</footer>

</body>
</html>
